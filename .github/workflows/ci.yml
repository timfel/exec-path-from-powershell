name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ['27.1', '28.2', '29.4']
    env:
      HOME: ${{ github.workspace }}/.home
    steps:
      - uses: actions/checkout@v5
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}
      - name: Prepare isolated HOME
        run: mkdir -p "$HOME/.emacs.d"
      - name: Run package checks
        run: make check

  melpa:
    runs-on: ubuntu-latest
    env:
      HOME: ${{ github.workspace }}/.home
    steps:
      - uses: actions/checkout@v5
      - uses: purcell/setup-emacs@master
        with:
          version: '29.4'
      - name: Prepare isolated HOME
        run: mkdir -p "$HOME/.emacs.d"
      - name: Clone MELPA
        run: git clone --depth 1 https://github.com/timfel/melpa.git ../melpa
      - name: Validate MELPA package
        run: make melpa-check melpa-sandbox
      - name: Validate MELPA Stable package
        if: startsWith(github.ref, 'refs/tags/v')
        run: make melpa-stable-check melpa-stable-sandbox
      - name: Upload check artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: melpa-logs
          path: |
            ../melpa/logs
            .cache
            .home
          if-no-files-found: ignore
